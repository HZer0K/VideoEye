# ============================================================
# 定期 fuzz —— 让 libFuzzer 入口真的跑起来
#
# 背景: tests/fuzz/ 有四个入口（VIDEOEYE_ENABLE_FUZZERS，默认 OFF），
# 但"有入口"不等于"在跑"。没人定期跑的话，入口会随依赖变化悄悄烂掉 ——
# 等真想用它查问题时才发现编不过，那就等于没有。
#
# 所以这里做两件事:
#   1) 每周定时构建 + 短跑（默认每个入口 120 秒），既防腐烂又能捞到回归；
#   2) 手动触发时可指定时长（workflow_dispatch），排查期想多跑就多跑。
#
# 三个 libFuzzer 参数是这个 job 的主要价值所在，别删:
#   -timeout=10        死循环会被抓成 timeout（码流解析器历史上出过空转数十亿次）
#   -rss_limit_mb=2048 无界分配会被抓成 OOM（历史上出过 4GB 分配）
#   -max_len=65536     输入尺寸有上界，保证跑得完
# 崩溃 / timeout / OOM 都会让 libFuzzer 非 0 退出并把复现输入写成 artifact。
#
# ❗ UBSan 默认是 recover 模式（报一行 "runtime error" 继续跑、进程照常退出 0）。
#   只靠本文件里的参数，UB 就只是日志噪声、job 依旧全绿 —— 2026-10-23 之前正是
#   如此：一轮跑出 10 处 signed-integer-overflow / 越界移位，而 job 是 success。
#   真正的开关在顶层 CMakeLists.txt 的 `-fno-sanitize-recover=undefined`：
#   UB 直接 abort → libFuzzer 当崩溃 → 非 0 退出 + 落复现输入。别把它删了。
# ============================================================

name: Fuzz

on:
  schedule:
    # 每周一 03:17 UTC（避开整点，GitHub 定时任务在整点最挤）
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: 每个 fuzz 入口跑多少秒
        required: false
        default: '120'
  # fuzz 入口或其依赖的解析层有改动时，也跑一遍（PR 上不跑: 太慢）
  push:
    branches: [master, main]
    paths:
      - 'tests/fuzz/**'
      - 'core/analysis/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (clang + ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang: libFuzzer 运行时只随 clang 分发；lld 非必需但链接更快
          # dpkg-dev/ffmpeg 同 build.yml: FFmpeg 走同一套查找逻辑
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build clang \
            qt6-base-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      # 与 build.yml 同一道门禁：系统 FFmpeg 必须 >= 7.1（libavcodec >= 61.19），
      # Ubuntu 24.04 的 6.1 不够，会自动换成 ffmpeg-version.json 里锁定的兜底包。
      - name: Ensure FFmpeg >= 7.1
        id: ffmpeg
        run: |
          set -euo pipefail
          root="$(bash scripts/fetch-ffmpeg.sh)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          set -euo pipefail
          root="${{ steps.ffmpeg.outputs.root }}"
          if [[ -n "${root}" ]]; then
            cmake --preset linux-fuzz -DFFMPEG_ROOT="${root}"
          else
            cmake --preset linux-fuzz
          fi

      - name: Build
        run: cmake --build --preset linux-fuzz

      # 门禁的自检：确认插桩参数真的进了编译命令。
      #
      # 为什么需要这一步：add_compile_options 写错、被后面的 target 覆盖、或者
      # 有人"清理一下 CMakeLists"时删掉某个参数，都**不会**产生任何编译错误 ——
      # 症状只会退化成"UBSan 又变回 recover 模式"，也就是日志里躺着 UB 而 job 全绿。
      # 那正是这个 job 存在的理由，所以这里在跑之前显式验一次。
      #
      # 判据取 ninja 的规则文件，不取构建日志：ninja 在 CI 日志里只打
      # `[4/232] Building CXX object ...`，**完全不回显命令行**（连必然存在的
      # -fsanitize=fuzzer-no-link 都搜不到），拿日志 grep 只会得到一个假的"没命中"。
      - name: Assert sanitizer flags are armed
        run: |
          set -euo pipefail
          fail=0
          for flag in "-fsanitize=fuzzer-no-link" "-fno-sanitize-recover=undefined"; do
            hits=$(grep -rho --include='*.ninja' -- "$flag" build/fuzz | wc -l)
            echo "$flag -> $hits 处编译规则"
            if [ "$hits" -eq 0 ]; then
              echo "::error::编译命令里没有 $flag"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "插桩没生效时这个 job 会变成假绿（UB 只报不拦），先修 CMakeLists.txt"
            exit 1
          fi

      - name: Run fuzzers
        run: |
          set -uo pipefail
          seconds="${{ github.event.inputs.seconds_per_target || '120' }}"
          mkdir -p build/fuzz/artifacts
          status=0
          ran=0
          # 产物在 build/fuzz/bin/：顶层 CMakeLists.txt 有
          #   set(CMAKE_RUNTIME_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/bin)
          #   （链接日志为 `Linking CXX executable bin/FuzzXxx`）。
          # ❗ 别指向 build/fuzz/tests/fuzz/ —— 那里只有 AUTOGEN 生成的
          #   FuzzXxx_autogen 目录（CMAKE_AUTOMOC 是全局开的），一个可执行文件都没有。
          #   旧写法 `for f in build/fuzz/tests/fuzz/Fuzz*` + `[[ -x "$f" ]]`
          #   因此匹配到的是 4 个目录：目录的 x 位为真 → 去执行目录 →
          #   "Is a directory" → status=1 → job 红。从 e7c1028 起一直如此，
          #   而**四个 fuzzer 一个都没跑过**，这个 job 的红是假红、绿也是假绿。
          shopt -s nullglob
          for f in build/fuzz/bin/Fuzz*; do
            # 只认普通文件：目录/符号链接一律跳过（-x 对目录也成立，这里是坑点）
            [[ -f "$f" && -x "$f" ]] || continue
            name="$(basename "$f")"
            echo "::group::$name"
            # 每次跑给一个独立 corpus 目录：libFuzzer 会把有价值的输入写回去，
            # 同一台 runner 上复用能慢慢攒出语料（不上传，只用于本次 job 内）
            mkdir -p "build/fuzz/corpus/$name"
            "$f" \
              "-artifact_prefix=build/fuzz/artifacts/${name}-" \
              "build/fuzz/corpus/$name" \
              -max_total_time="$seconds" \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -max_len=65536 \
              -print_final_stats=1 || status=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          # 一个入口都没跑起来时必须红，不能静默通过 —— 否则"入口烂掉了"这件事
          # 又会退回成"job 是绿的"，跟这个 job 存在的理由正好相反。
          if [ "$ran" -eq 0 ]; then
            echo "::error::没有找到任何 fuzz 入口（build/fuzz/bin/Fuzz*），构建可能静默失败"
            exit 1
          fi
          echo "本次跑过的 fuzz 入口数: $ran"
          exit $status

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts
          if-no-files-found: ignore
