name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-release
          - os: windows-latest
            preset: win-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─────────────── Linux ───────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build \
            qt6-base-dev qt6-charts-dev \
            libopencv-dev libsdl2-dev zlib1g-dev \
            libvulkan-dev glslc \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: VideoEye-linux
          path: build-linux/bin

      # ─────────────── Windows ───────────────
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 不用第三方 action (friendlyanon/setup-vcpkg 常因 codeload 限流
          # 下载失败), 直接使用 runner 预装 vcpkg 或 git clone, 再检出与
          # vcpkg-configuration.json 的 builtin-baseline 一致的版本
          # (2025-04-17 提交 fd22bbac)
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg clone failed"; exit 1 }
          }
          # 浅克隆需 fetch 目标提交; 完整仓库该步为 no-op
          $vcpkgRef = "fd22bbac96555f6c43ee35f143a634daed53369c"
          git -C $vcpkgRoot fetch --depth 1 origin $vcpkgRef 2>$null
          git -C $vcpkgRoot checkout --force $vcpkgRef
          if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg checkout $vcpkgRef failed"; exit 1 }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $vcpkgRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "vcpkg ready: $(& "$vcpkgRoot\vcpkg.exe" version)"

      - name: Cache vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'scripts/triplets/x64-windows-release.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # release-only 覆盖 triplet (scripts/triplets/x64-windows-release.cmake),
          # host==target 同名避免交叉编译分支; 省 ~2GB 磁盘与一半安装时间
          # overlay-ports: 用本地 zlib port (移除 vcpkg_fixup_pkgconfig, 避免
          # vcpkg_acquire_msys 下载被滚动镜像删除的旧 MSYS2 包 → 404)
          vcpkg install --triplet x64-windows-release --host-triplet x64-windows-release --overlay-triplets=scripts/triplets --overlay-ports=scripts/overlay-ports --x-manifest-root=. --x-install-root=vcpkg_installed

      - name: Validate CMake Preset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 激活 MSVC 环境 (与 build_ninja.ps1 同方式: vswhere + vcvars64.bat)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          $vcvars = "$vsRoot\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" x64 && set" | ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') {
                  Set-Item -Path "env:$($matches[1])" -Value $matches[2].TrimEnd()
              }
          }
          # 验证 preset 可正常 configure (提前发现 preset 配置损坏)
          # 同时预配置 build-ninja/ 目录, build_ninja.ps1 会增量重配置 (很快)
          cmake --preset win-release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake preset 'win-release' validation failed"
            exit 1
          }
          Write-Host "Preset validation passed"

      - name: Build (Windows, incl. FFmpeg fetch + configure + compile)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build_ninja.ps1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build-ninja\bin\VideoEye.exe"
          if (-not (Test-Path $exe)) { Write-Error "VideoEye.exe not found"; exit 1 }
          $p = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "Smoke test failed: app exited early with code $($p.ExitCode) (可能缺 DLL)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed: app stayed running 8s"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: VideoEye-windows
          path: build-ninja/bin
