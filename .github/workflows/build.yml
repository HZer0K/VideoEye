name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # 分层边界检查: 只依赖 Python 标准库, 不需要构建, 几秒跑完, 所以放在最前面 ——
  # 分层违规应该在编译之前就被拦住, 而不是等二十分钟构建完才发现。
  #
  # 为什么必须单独跑脚本, 不能指望 CMake: 每个模块的 include 目录都是仓库根
  # (见 CMakeLists.txt 里的 videoeye_add_module), 所以任何模块都能 #include "core/xxx.h"
  # 并且编译一定通过; 链接期只对"没声明这条边"的跨层调用报错, 而主程序 ui 显式链了全部
  # 模块 —— 对 ui 层来说 CMake 的约束力是零。真正守住依赖方向的就是这两个脚本。
  layering:
    name: Layering check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check include direction
        run: python3 scripts/check_layering.py

      - name: Check Qt/domain border
        run: python3 scripts/audit_qt_domain_border.py

      # 审计脚本自己的退出码也得被测：它历史上出过「打印了 [命中] 却 return 0」，
      # 光看输出人肉是看不出来的（命中信息都打出来了），只有退出码能被机器盯住。
      - name: Self-check audit exit codes
        run: python3 scripts/test_audit_qt_domain_border.py

      # check_layering.py 是同一类 bug 的重灾区（2026-10-05 修的：它曾经打印 [!] 却
      # return 0，于是 pre-commit 和这里都是一路绿），所以它的退出码同样要被自测盯住。
      - name: Self-check layering exit codes
        run: python3 scripts/test_check_layering.py

      - name: Check Qt/analysis border
        run: python3 scripts/audit_qt_analysis_border.py

      - name: Self-check Qt/analysis audit exit codes
        run: python3 scripts/test_audit_qt_analysis_border.py

      # 命名空间跟不跟目录走（2026-10-05 清完 analyzer / utils 之后立的门）。
      - name: Check namespace layout
        run: python3 scripts/audit_namespace_layout.py

      - name: Self-check namespace layout exit codes
        run: python3 scripts/test_audit_namespace_layout.py

      # 链接可见性（2026-10-07 立的门）: 公共头闭包需要的 Qt / FFmpeg 依赖必须由该
      # target 的 PUBLIC 链接闭包提供 —— 挂成 PRIVATE 时模块内部照样编译（include
      # 目录是仓库根），只有外部目标 include 该模块公共头才会撞上（P2-8 形态）。
      - name: Check link visibility
        run: python3 scripts/audit_link_visibility.py

      - name: Self-check link visibility audit exit codes
        run: python3 scripts/test_audit_link_visibility.py

      # 测试规模与 README 快照对齐: README 里的计数曾经长期落后（写 48, 实际 49）。
      # 这里只数 `tests/` 目录, 不需要构建, 放在这个 job 最便宜。
      - name: Check test-count snapshot (README table)
        run: python3 scripts/summarize_tests.py --check-readme

      - name: Self-check test summary generation
        run: python3 scripts/test_summarize_tests.py

  # 格式门禁: .clang-format 一直在仓库里, 但此前没有任何机器执行过它 —— pre-commit
  # 钩子的第 4 道门在没装 clang-format 的机器上只 warning 跳过, CI 里则完全没有
  # 这一环, 等于「配置存在, 无人执行」。这里补上 CI 兜底。
  #
  # 只卡本次改动/新增的 C++ 文件 (与钩子同语义, 基线规则见 scripts/ci-changed-files.sh):
  # 历史文件没做过全量格式化, 一次性卡全量会把无关旧文件卷进同一个红, 不利于定位。
  # 也刻意不做成 ctest 用例 —— 本机缺 clang-format 时它会假绿, 不如让它在 CI 里真跑。
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 增量检查要算改动范围, 浅克隆拿不到基线

      # 版本必须钉死，不能 `apt install clang-format`。
      #   apt 的 clang-format 跟着 runner 镜像走（ubuntu-24.04 = 18.1.3，镜像一升到
      #   26.04 就变 20.x）。换行位置、注释对齐、include 排序跨大版本都会变，于是
      #   「上周全绿的文件、这周同一份代码集体变红」，改的是 CI 而不是代码。
      #   这里用 PyPI 的 wheel 钉到 18.1.8 —— 和 CONTRIBUTING.md 里给本机的
      #   `pip install clang-format==18.1.8` 是**同一个二进制**，本地判绿 CI 也绿。
      - name: Install clang-format
        run: |
          python3 -m pip install --user "clang-format==18.1.8" ||
            python3 -m pip install --user --break-system-packages "clang-format==18.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version

      - name: Check changed C++ files
        run: |
          set -euo pipefail
          files=$(bash scripts/ci-changed-files.sh)
          if [ -z "$files" ]; then
            echo "本次改动没有 C++ 文件, 跳过"
            exit 0
          fi
          echo "检查文件:"; echo "$files"
          fail=0
          for f in $files; do
            if ! clang-format --dry-run --Werror "$f"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::上述文件不符合 .clang-format (修复: clang-format -i <文件> 后重新提交)"
            exit 1
          fi
          echo "格式检查通过"

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─────────────── 打包 / 冒烟 ───────────────
          # 跑的是可发布产物，UI 层的 offscreen 冒烟走 linux-test-debug。
          #
          # 注意: sanitizer 的 linux-test-asan / linux-test-tsan **不**进这个矩阵。
          # 它们的 binaryDir 是 build/test-{asan,tsan}，而这个 job 的 install / 上传
          # 产物全写死 build/release/dist —— 塞进来只会让 install 找不到目录，并且
          # 拿一个 Debug+Sanitizer 的构建去覆盖同名 VideoEye-linux 产物。
          # 那两个 preset 归下面单独的 sanitizer job 管，那里只 ctest、不打包。
          - os: ubuntu-latest
            preset: linux-release
          - os: windows-latest
            preset: win-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────── Linux ───────────────
      # 项目只剩两个硬依赖: Qt Widgets + FFmpeg。Linux 上优先用系统开发包
      # (由 cmake/deps/FFmpegPrebuilt.cmake 通过 pkg-config 查找)。
      #
      # ⚠️ 但系统 FFmpeg 必须 >= 7.1（libavcodec >= 61.19），否则 configure 会被
      # cmake/deps/FfmpegApiProbe.cmake 的符号门禁拦下。发行版常常不够（Ubuntu 24.04
      # 是 6.1、Debian 12 是 5.1），所以这里先判断一次：不够就换 ffmpeg-version.json
      # 里锁定的兜底包，把目录交给 -DFFMPEG_ROOT。
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build \
            qt6-base-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      # 与 test / sanitizer job 共用同一个入口（.github/actions/ensure-ffmpeg），
      # 别再在这里内联一份「检测 → 兜底 → 拼 -D」的逻辑：三处各写一遍的结果
      # 就是 test job 漏了这一步。
      - name: Ensure FFmpeg >= 7.1 (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg
        uses: ./.github/actions/ensure-ffmpeg

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # 系统够新时 cmake_args 是空串，直接展开即可，不需要分支。
          cmake --preset ${{ matrix.preset }} ${{ steps.ffmpeg.outputs.cmake_args }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset ${{ matrix.preset }}

      # 必须从 install 出来的目录上传: 构建目录里的可执行文件靠 RPATH 指到
      # build/release/lib 才能找到 FFmpeg, 而上传物只有 bin/ —— 下载下来就是
      # 一个跑不起来的包。install 会把 bin/ + lib/ 一起铺好。
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: cmake --install build/release --prefix build/release/dist

      # 冒烟检查装出来的东西: 依赖解析 + 原生 ffmpeg + GUI 存活
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dist="$PWD/build/release/dist"
          echo "== 产物 =="; ls -l "$dist/bin" "$dist/lib"

          # 1) 动态依赖必须全部解析(linux 上 FFmpeg 装在 lib/ 靠 $ORIGIN/../lib 找)
          if ldd "$dist/bin/VideoEye" | grep -i "not found"; then
            echo "::error::存在无法解析的动态库依赖"; exit 1
          fi

          # 2) 原生 ffmpeg 冒烟: Linux 不随包分发, 用系统那份即可
          #    (命令工作台页会显示它的路径与版本; 缺了只是该页不可用, 不影响 GUI)
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "::warning::runner 上没有 ffmpeg, 跳过命令工作台的程序冒烟"
          fi

          # 3) GUI 存活: 无显示器环境用 offscreen 插件起 8s。
          #    若 runner 上没装这个插件(qt.qpa.plugin 报错), 只警告 —— 那是环境
          #    缺插件, 不是打包缺库, 不该把 CI 打红。
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 "$dist/bin/VideoEye" > gui-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "GUI 存活 8s (被 timeout 结束) —— 通过"
          elif grep -q "qt.qpa.plugin" gui-smoke.log; then
            echo "::warning::offscreen 平台插件不可用, 跳过 GUI 存活检查"
            cat gui-smoke.log
          else
            echo "::error::GUI 提前退出 (code=$code)"; cat gui-smoke.log; exit 1
          fi

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: VideoEye-linux
          path: build/release/dist

      # ─────────────── Windows ───────────────
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 用最新 vcpkg: msys2 滚动镜像会删除旧包, 锁定旧 commit 会导致
          # vcpkg_acquire_msys 下载 404 (如 msys2-runtime-*.pkg.tar.zst)
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg clone failed"; exit 1 }
          } else {
            git -C $vcpkgRoot fetch --depth 1 origin master 2>$null
            if ($LASTEXITCODE -eq 0) { git -C $vcpkgRoot reset --hard FETCH_HEAD }
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $vcpkgRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "vcpkg ready: $(& "$vcpkgRoot\vcpkg.exe" version)"

      # key 必须覆盖所有会影响 vcpkg 产物的输入: manifest / baseline / overlay triplet /
      # overlay port，以及决定用哪个 triplet 的 CMakePresets.json。漏掉 overlay port
      # 的话改了自定义 port 也会命中旧缓存。
      #
      # 前缀刻意与 test / release 两个 job **共用同一个命名空间**（vcpkg-<os>-）。
      # 以前三处各用一套前缀（vcpkg- / vcpkg-tests- / vcpkg-rel-），结果是同一份
      # x64-windows-release 依赖被存了三份、也冷启了三次 —— 缓存命中率被自己砍掉 2/3。
      # 现在无论哪个 job 先跑完，存下的那份其余 job 都能直接用。
      # ⚠️ 已知代价: test job 的 vcpkg_installed 里多一个 gtest（VCPKG_MANIFEST_FEATURES=tests），
      #    build job 恢复它之后 manifest 模式会把它裁掉——多花几秒，比冷装 Qt 便宜得多。
      - name: Cache vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'scripts/triplets/**', 'scripts/overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # 与开发者本机同一入口 (scripts/run-vcpkg-install.ps1)，避免在 CI 里再抄一份参数
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/run-vcpkg-install.ps1 -Config release
          exit $LASTEXITCODE

      # FFmpeg 版本与 SHA256 由 cmake/ffmpeg-version.json 锁定（钉在按月归档的
      # autobuild tag 上，不跟随 BtbN 的 latest —— rolling 资产会天天变哈希）
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build.bat release

      # 与 Linux 一样: 上传 install 出来的目录, 顺带验证安装规则本身
      # (FFmpeg DLL / Qt 插件 / 依赖闭包都在这一步铺进 dist\bin)
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake --install build\release --prefix build\release\dist

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "build\release\dist"
          $exe  = "$dist\bin\VideoEye.exe"
          $ff   = "$dist\bin\ffmpeg.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }

          # ffmpeg 冒烟: 默认**不**随包分发(GPLv3, 见 docs/FFMPEG_COMMAND_WORKBENCH.md),
          # 所以只有当打包者显式开了 -DVIDEOEYE_BUNDLE_FFMPEG_TOOL=ON 才会出现。
          # 有就验证它能跑(说明依赖的 av*.dll 都在 dist\bin 里), 没有则只是该页
          # 需要用户自行安装, 不该把 CI 打红。
          if (Test-Path $ff) {
            & (Resolve-Path $ff) -version
            if ($LASTEXITCODE -ne 0) { Write-Error "ffmpeg smoke failed (exit $LASTEXITCODE)"; exit 1 }
          } else {
            Write-Warning "dist\bin 里没有 ffmpeg.exe (默认不随包分发), 跳过命令工作台的程序冒烟"
          }

          $p = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "Smoke test failed: app exited early with code $($p.ExitCode) (可能缺 DLL)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed: app stayed running 8s"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: VideoEye-windows
          path: build/release/dist

  # ─────────────── 单元测试 ───────────────
  # 单独的 job: 测试用 Debug + vcpkg feature "tests"(gtest)，
  # 和主构建用不同的 triplet / 不同的依赖集，混在一个矩阵里会互相拖累。
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-test-debug
          # Windows 用 win-test-release: debug 配置需要重新编译一整套 debug triplet
          # 的 Qt（约 1 小时），在 CI 上不划算
          - os: windows-latest
            preset: win-test-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang-tidy 供下面的静态检查两步使用: 全配置摸底(只报告)与窄检查硬门(拦截)
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build \
            qt6-base-dev libgtest-dev clang-tidy \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg clone failed"; exit 1 }
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $vcpkgRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          # 与 build job 同一命名空间，见那边的说明。
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'scripts/triplets/**', 'scripts/overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Windows 上 gtest 由 preset 的 VCPKG_MANIFEST_FEATURES=tests 带来，
      # 所以这里必须显式带 -Feature tests 装上，否则 configure 才去装、链路绕一圈。
      - name: Install dependencies (Windows, tests feature)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/run-vcpkg-install.ps1 -Config release -Feature tests
          exit $LASTEXITCODE

      # ⚠️ 这一步不能漏。以前这里装完系统依赖就直接 configure：Ubuntu 24.04 的系统
      # FFmpeg 是 6.1，而 cmake/deps/FfmpegApiProbe.cmake 的符号门禁要求 >= 7.1
      # （libavcodec 61.19），于是「普通构建绿、单测任务配置失败」—— 同一份代码两种结论，
      # 而且红的那个 job 与 FFmpeg 看起来毫无关系。现在与 build / sanitizer
      # 共用同一个入口。
      - name: Ensure FFmpeg >= 7.1 (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg
        uses: ./.github/actions/ensure-ffmpeg

      - name: Build + Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat test

      - name: Configure (tests)
        if: runner.os == 'Linux'
        run: cmake --preset ${{ matrix.preset }} ${{ steps.ffmpeg.outputs.cmake_args }}

      - name: Build (tests)
        if: runner.os == 'Linux'
        run: cmake --build --preset ${{ matrix.preset }}

      # clang-tidy 摸底: .clang-tidy 配置存在但从未被机器执行过(钩子只查格式)。
      # 全量跑必然是一屏存量告警(modernize-use-auto / concat-nested-namespaces /
      # braces-around-statements 之类), 所以这一步只用完整配置对本次改动的 .cpp
      # 做**只报告**的摸底, 不拦 job; 真正的硬门是紧接着的窄检查步骤。
      # 依赖 compile_commands.json: linux-base preset 已开 CMAKE_EXPORT_COMPILE_COMMANDS。
      - name: clang-tidy changed files (report-only)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail   # 故意不用 -e: 本步只报告, 任何解析失败都不该拦 job
          files=$(bash scripts/ci-changed-files.sh | grep -E '\.cpp$' || true)
          if [ -z "$files" ]; then
            echo "本次改动没有 .cpp 文件, 跳过"
            exit 0
          fi
          for f in $files; do
            echo "::group::clang-tidy $f"
            clang-tidy -p build/test-debug "$f" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done
          echo "clang-tidy 摸底完成 (只报告, 不拦截)"

      # clang-tidy 硬门: 从完整配置里挑出"命中即真缺陷、且全仓零存量"的一组
      # bugprone 检查, 对本次改动的 .cpp 以 warnings-as-errors 拦截。
      #
      # 为什么不是直接 --warnings-as-errors 跑 .clang-tidy: 那套配置在存量代码上
      # 一屏告警(实测单个 600 行 .cpp 就有 30+ 条风格类), 开启即红, 只能当摸底。
      # 这组的入选标准是**语义缺陷**而不是风格:
      #   use-after-move / dangling-handle / move-forwarding-reference —— 悬垂引用,
      #   正是本项目历史上 TaskHandle 配对、QcRunner 线程捕获那类问题的形态;
      #   infinite-loop / suspicious-semicolon —— 循环边界写错、分号吞掉循环体;
      #   sizeof-expression / suspicious-memset-usage / undefined-memory-manipulation;
      #   unused-raii —— 构造了锁/守卫却没用;
      #   string-integer-assignment / unhandled-exception-at-new。
      # 基线: 2026-10-25 在 11 个跨层 .cpp(parser / player / ui / infra / qc / ui)
      # 上实测 0 告警, 所以这扇门不会一开就红。
      #
      # 修法优先级: 先改代码; 确实需要保留时用带理由的 `// NOLINT(check-name)`。
      - name: clang-tidy hard gate (changed files)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          files=$(bash scripts/ci-changed-files.sh | grep -E '\.cpp$' || true)
          if [ -z "$files" ]; then
            echo "本次改动没有 .cpp 文件, 跳过"
            exit 0
          fi
          checks='-*,bugprone-use-after-move,bugprone-dangling-handle,'
          checks+='bugprone-infinite-loop,bugprone-sizeof-expression,'
          checks+='bugprone-unused-raii,bugprone-move-forwarding-reference,'
          checks+='bugprone-suspicious-memset-usage,'
          checks+='bugprone-undefined-memory-manipulation,'
          checks+='bugprone-string-integer-assignment,'
          checks+='bugprone-suspicious-semicolon,'
          checks+='bugprone-unhandled-exception-at-new'
          fail=0
          for f in $files; do
            echo "::group::clang-tidy (hard gate) $f"
            if ! clang-tidy -p build/test-debug --checks="$checks" \
                 --warnings-as-errors='*' "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::clang-tidy 硬门命中(见上面的 warning/error)。请在本地用同一条命令复现后修复。"
            exit 1
          fi
          echo "clang-tidy 硬门通过"

      - name: Run ctest
        if: runner.os == 'Linux'
        run: ctest --preset ${{ matrix.preset }}

  # ─────────────── 内存 / 数据竞争体检 ───────────────
  # 单独一个 job，不并进 test：sanitizer 会把测试跑得慢一个量级、产出也大，
  # 而且 TSan/ASan 的报错会让 ctest 输出淹没，混在一起没人看得见真正挂的那个。
  #
  # 为什么必须有：本项目历史上那类**随机** 0xc0000374（堆破坏）在本地怎么复现都测不出来
  # （加探针症状就消失），只有 sanitizer 能给出确定性结论。TSan 那一路盯的是
  # TaskManager / 取消令牌 / 面板关停这几处"两颗原子标志 + 一把锁"的并发协议。
  #
  # 已知噪声：TSan 会报 Qt6 自身的数据竞争（Qt 不是 TSan-clean 的库），真红了先看
  # 报头是不是我们自己那几个 .cpp；必要时在 TSAN_OPTIONS 里加 suppression 文件。
  #
  # ❗ 为什么这里**不**加 `-fno-sanitize-recover=undefined`（而 fuzz 树加了）：
  #   UBSan 只插桩"我们自己编译的 TU"，但 Qt 的头文件是被 include 进这些 TU 里的
  #   —— 于是 Qt 头里的内联代码也带插桩。这个 job 一链 Qt，任何一处 Qt 头内的
  #   有符号溢出都会让 ctest 直接 abort，而我们既改不了 Qt 也没法只按"某个头"
  #   关掉 UBSan。fuzz 树刻意不链 Qt，所以那边开 halt 是安全的（UB 全部落在
  #   本仓库自己的解析层），门禁开在那边、噪声留在这边。
  sanitizer:
    name: Sanitizer (${{ matrix.sanitizer }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            preset: linux-test-asan
          - sanitizer: tsan
            preset: linux-test-tsan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 test job 同一套依赖；不装 FFmpeg 的 GUI 部分之外的东西，sanitizer 只跑单测。
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build \
            qt6-base-dev libgtest-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      # sanitizer 构建也要过同一道 FFmpeg 门禁，否则连编都编不过。
      - name: Ensure FFmpeg >= 7.1
        id: ffmpeg
        uses: ./.github/actions/ensure-ffmpeg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ steps.ffmpeg.outputs.cmake_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # 不 --stop-on-failure: sanitizer 场景下想一次看到所有问题（ASan 报完进程就死，
      # 逐个跑能省很多轮）。Linux 上 ctest 默认并行跑，这里关掉以免互相抢 CPU 拖时间。
      #
      # 为什么没有 TSAN_OPTIONS=suppressions=...: 试过，压不住。TSan 的 race: 按函数名
      # 精确匹配，Qt 的 C++ 符号（QWaitCondition::~QWaitCondition 这类）对不上；而能压住
      # QArrayData / operator delete / memmove 的范围又太宽，会连我们自己的竞争一起压掉。
      # 真属于 Qt 自身的那两处改成在用例里显式跳过（tests/unit/SanitizerSkip.h），
      # 哪几条、为什么，写在代码里比写在压制文件里可读。
      # 自检：先确认 log_path 这套机制在 runner 上真的能把报告写成文件。
      # 这道门禁最危险的失效方式不是误报，而是**静默变绿** —— 报告去不了文件、
      # 又被 ctest 吞掉，于是一个 UB 都没有。拿一段必然溢出的代码试同一个开关，
      # 比事后猜"为什么 CI 一直是绿的"便宜得多。
      - name: Probe UBSan report path
        if: matrix.sanitizer == 'asan'
        env:
          # 写到独立目录，别让探针的报告被正式门禁当成项目命中。
          UBSAN_OPTIONS: print_stacktrace=1:log_exe_name=1:log_path=${{ github.workspace }}/build/ubsan-probe/ubsan
        run: |
          set -euo pipefail
          rm -rf build/ubsan-probe && mkdir -p build/ubsan-probe
          cat > /tmp/ub-probe.c <<'EOF'
          /* argc 让 v + argc 在 -O0 下也逃不过常量折叠 */
          int main(int argc, char **argv) {
              int v = 2147483647;
              int w = v + argc;
              return w == 0 && argv[0];
          }
          EOF
          gcc -fsanitize=undefined -O0 /tmp/ub-probe.c -o /tmp/ub-probe
          /tmp/ub-probe || true
          ls -l build/ubsan-probe
          if [ -z "$(ls -A build/ubsan-probe)" ]; then
            echo "::error::UBSan 没有把报告写进 log_path —— 门禁会静默变绿，先修这里"
            exit 1
          fi
          grep -q "signed integer overflow" build/ubsan-probe/ubsan* || {
            echo "::error::UBSan 报告里没有预期的 signed integer overflow，探针不可靠"
            exit 1
          }
          echo "OK: UBSan 报告可落盘"

      - name: Run ctest
        env:
          # UBSan 报告必须落成文件，原因见下面 gate 步骤。
          # 值必须在这里给：ctest 是往进程环境里"追加" testPreset 的 environment，
          # preset 里写的是 log_path=$penv{VE_UBSAN_LOG_DIR}/ubsan（CMakePresets.json），
          # 不设就会展开成 /ubsan —— 不可写，报告回到 stderr 随风而去。
          VE_UBSAN_LOG_DIR: ${{ github.workspace }}/build/ubsan
        run: |
          set -o pipefail
          mkdir -p "$VE_UBSAN_LOG_DIR"
          # 落盘一份明细：下面的 UBSan 判据要靠它 —— ctest 只会因为
          # "进程非零退出" 变红，而 halt_on_error=0 让 UB 根本不会终止进程。
          #
          # ❗ 但**光靠这个日志收不到 UBSan 报告**：ctest 只在测试失败时回显它的
          # 输出（--output-on-failure 的字面含义）。halt_on_error=0 时 UB 之后进程
          # 照常返回 0、测试算通过，那段 runtime error 直接被吞掉。实测
          # --test-output-size-passed=2000000 也救不回来，日志里仍然只有框架行。
          ctest --preset ${{ matrix.preset }} -j 1 --output-on-failure 2>&1 | tee ctest-sanitizer.log

      # UBSan 的失败判据（只对 asan 那一路，因为 preset 里是 ASan+UBSan 一起开的）。
      #
      # 背景：preset 把 halt_on_error 设成 0，因为 Qt 的头文件被 include 进我们的 TU，
      # 其中的内联代码也带插桩，任何一处有符号溢出都会让 ctest 直接 abort，而我们既
      # 改不了 Qt、也没法只按"某个头"关掉 UBSan。
      #
      # 但那把项目自己的 UB 也一起放过了。这里不调 halt（那会把 Qt 噪声变成红灯），
      # 而是把**判据按路径收窄**：只认落在本仓库、且不在构建产物 / 第三方目录里的
      # runtime error。这比"关掉 UBSan"精确，也比"人工看日志"可靠。
      #
      # 报告来源两处，缺一不可：
      #   1. ctest 日志 —— 测试因别的缘故失败时，它的输出会被回显，UB 顺带在里面；
      #   2. UBSan 自己写的文件（VE_UBSAN_LOG_DIR/ubsan.<exe>.<pid>）—— 测试通过时
      #      唯一能拿到报告的途径。没这一路，这道门禁就是个永远绿的摆设。
      #
      # 顺带一提 if: always() 的用意：ctest 因 ASan/断言的测试失败时，这一步仍然跑，
      # 一轮就能看到"哪些测试炸了 + 哪些地方有 UB"，不用改一遍推一遍。
      - name: UBSan gate (project sources only)
        if: always() && matrix.sanitizer == 'asan'
        env:
          VE_UBSAN_LOG_DIR: ${{ github.workspace }}/build/ubsan
          WORKSPACE: ${{ github.workspace }}
          # 首轮摸底：把仓库变量 UBSAN_GATE_MODE 设成 warn —— 照样在 step summary
          # 和文件注释里列出全部命中，但不判红；存量修完后删掉该变量（或设回
          # strict）即收紧。未设置时默认 strict。
          GATE_MODE: ${{ vars.UBSAN_GATE_MODE || 'strict' }}
        run: |
          python3 - <<'PY'
          import collections, glob, os, re, sys

          ws = os.environ.get("WORKSPACE", "")
          mode = (os.environ.get("GATE_MODE") or "strict").strip().lower()
          strict = mode != "warn"

          # 构建产物 / 第三方：路径里即便出现 core/ 也不算我们的源码。
          exclude = ("build/", "third_party/", "vcpkg_installed/", "out/", ".git/")
          # 相对路径的 __FILE__ 只能靠顶层目录名认（见下面 project_relative）。
          source_tops = ("core/", "ui/", "infrastructure/", "tests/", "scripts/", "cmake/")

          def project_relative(path):
              """本仓库内的相对路径；不属于本仓库（Qt/系统头/构建目录）返回 None。"""
              p = path.strip().replace("\\", "/").strip('"')
              if not p:
                  return None
              absolute = p.startswith("/") or re.match(r"^[A-Za-z]:/", p)
              if absolute:
                  if not ws:
                      return None
                  try:
                      rp = os.path.relpath(os.path.normpath(p), os.path.normpath(ws))
                  except ValueError:
                      return None
                  rp = rp.replace("\\", "/")
                  if rp == ".." or rp.startswith("../"):
                      return None
              else:
                  rp = os.path.normpath(p).replace("\\", "/")
                  if rp == ".." or rp.startswith("../"):
                      # 构建目录落在源码树里时，__FILE__ 会是 ../core/xxx.cpp。
                      # 剥掉前导 .. 后若落在源码顶层目录就算本仓库的，否则（../usr/...、
                      # ../vcpkg_installed/...）照旧丢弃。不剥这一层会把它们全漏掉。
                      stripped = rp
                      while stripped.startswith("../"):
                          stripped = stripped[3:]
                      if not stripped.startswith(source_tops):
                          return None
                      rp = stripped
              if any(rp.startswith(t) for t in exclude):
                  return None
              return rp

          # 位置形如 dir/file.cpp:42:13 ，但 Qt 内部的行未必带行列号，
          # 所以下面用"含 runtime error: 即计入"的兜底，避免格式一变就静默漏报。
          located = re.compile(
              r"^(?P<path>.+?):(?P<line>\d+):(?P<col>\d+):\s*runtime error:\s*(?P<msg>.+)$")

          sources = []
          if os.path.isfile("ctest-sanitizer.log"):
              sources.append("ctest-sanitizer.log")
          ub_dir = os.environ.get("VE_UBSAN_LOG_DIR", "")
          # 目录必须由上面那步 mkdir 出来。不存在 = 变量没传进步骤，
          # 报告只会回到 stderr、又被 ctest 吞掉 —— 门禁静默变绿。宁可红。
          if not ub_dir or not os.path.isdir(ub_dir):
              print("::error::VE_UBSAN_LOG_DIR 未设置或目录不存在（%r）："
                    "UBSan 报告无处可落，这道门禁会静默变绿" % ub_dir)
              sys.exit(1)
          sources += sorted(p for p in glob.glob(os.path.join(ub_dir, "ubsan*"))
                            if os.path.isfile(p))

          total = 0
          hits = []      # (相对路径, 行号, 信息原文)
          unknown = []   # 有 runtime error 但没能定位到位置的原文
          for src in sources:
              with open(src, "r", errors="replace") as fh:
                  for raw in fh:
                      if "runtime error:" not in raw:
                          continue
                      total += 1
                      line = raw.strip()
                      m = located.match(line)
                      rel = project_relative(m.group("path")) if m else None
                      if rel:
                          hits.append((rel, int(m.group("line")), m.group("msg").strip()))
                      elif not m:
                          unknown.append(line)

          grouped = collections.OrderedDict()
          for rel, ln, msg in hits:
              key = (rel, ln, msg[:100])
              grouped[key] = grouped.get(key, 0) + 1

          # 人看的部分：按位置排序，同位置只出现一次并带出现次数。
          rows = sorted(grouped.items(), key=lambda kv: (kv[0][0], kv[0][1]))
          summary = ["## UBSan（本仓库源码）", ""]
          summary.append("扫描来源：%s" % (", ".join(sources) if sources else "（无）"))
          summary.append("")
          summary.append("runtime error 共 %d 条，落在本仓库源码 %d 条，去重后 %d 处。"
                         % (total, len(hits), len(rows)))
          summary.append("")
          if rows:
              summary.append("| 位置 | 次数 | 类型 |")
              summary.append("| --- | --- | --- |")
              for (rel, ln, msg), n in rows[:60]:
                  cell = msg.replace("|", "\\|")[:120]
                  summary.append("| `%s:%d` | %d | %s |" % (rel, ln, n, cell))
              if len(rows) > 60:
                  summary.append("")
                  summary.append("（另有 %d 处未列出，见 job 日志）" % (len(rows) - 60))
          if unknown:
              summary.append("")
              summary.append("另有 %d 条 runtime error 没能解析出位置，需人工确认"
                             "（可能是第三方代码）：" % len(unknown))
              for line in unknown[:10]:
                  summary.append("")
                  summary.append("    " + line[:200])
          text = "\n".join(summary)
          print(text)

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
              try:
                  with open(out, "a") as fh:
                      fh.write(text + "\n")
              except OSError:
                  pass

          severity = "error" if strict else "warning"
          for (rel, ln, msg), _n in rows[:20]:
              note = msg.replace("%", "%25").replace("\r", "").replace("\n", " ")[:180]
              print("::%s file=%s,line=%d,title=UBSan::%s" % (severity, rel, ln, note))

          if unknown:
              print("::warning::有 %d 条 runtime error 无法定位来源，请翻上面的日志确认"
                    % len(unknown))

          if rows and strict:
              print("::error::本仓库源码存在未定义行为（halt_on_error=0，所以 ctest 不会红）；"
                    "修完再合，或把仓库变量 UBSAN_GATE_MODE 设成 warn 先摸底")
              sys.exit(1)
          if rows:
              print("UBSan: %d 处命中，但 GATE_MODE=warn，本轮不判红。" % len(rows))
          else:
              print("UBSan: 本仓库源码无 runtime error")
          PY

